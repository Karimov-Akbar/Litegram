# Builds the release APK (armeabi-v7a). Runs manually ("Run workflow") and for version tags
# (v*), which also publish a GitHub release.
#
# Optional repository secrets (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_API_ID, TELEGRAM_API_HASH  - your API credentials from https://my.telegram.org
#   KEYSTORE_BASE64                     - release keystore: base64 -w0 litegram.jks
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Without the keystore secrets the APK is signed with the public dummy key of upstream Telegram.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK, NDK r25c (last NDK for Android 4.4), CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;25.2.9519653 cmake;3.22.1'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: local.properties
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "litegram.apiId=$API_ID"
            echo "litegram.apiHash=$API_HASH"
          } > local.properties
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/litegram.jks"
            {
              echo "litegram.storeFile=$RUNNER_TEMP/litegram.jks"
              echo "litegram.storePassword=$KEYSTORE_PASSWORD"
              echo "litegram.keyAlias=$KEY_ALIAS"
              echo "litegram.keyPassword=$KEY_PASSWORD"
            } >> local.properties
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleRelease -PlitegramAbis=armeabi-v7a --no-daemon --stacktrace

      - name: Upload APK and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: litegram-release
          path: |
            TMessagesProj_App/build/outputs/apk/release/*.apk
            TMessagesProj_App/build/outputs/mapping/release/mapping.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TMessagesProj_App/build/outputs/apk/release/*.apk
          draft: true
