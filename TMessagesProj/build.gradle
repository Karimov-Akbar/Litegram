import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

apply plugin: 'com.android.library'
apply plugin: 'org.telegram.build-plugin'
apply plugin: 'idea'

idea {
    module {
        excludeDirs += [
            file('jni/td'),
            file('jni/third_party/absl'),
            file('jni/third_party/boringssl'),
            file('jni/third_party/dav1d'),
            file('jni/third_party/ffmpeg'),
            file('jni/third_party/libvpx'),
            file('jni/third_party/libyuv'),
            file('jni/third_party/openh264'),
            file('jni/third_party/xiph'),
            file('jni/tlottie'),
            file('jni/voip/webrtc'),
            file('jni/sqlite')
        ]
    }
}

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

// Litegram: ABIs to build native code for. Android 4.4 devices are 32-bit only,
// so armeabi-v7a is enough (pass -PlitegramAbis=armeabi-v7a,x86 for an emulator build).
def litegramAbis = (project.findProperty('litegramAbis') ?: 'armeabi-v7a').toString().split(',').collect { it.trim() }
// Litegram: -PlitegramSkipNative skips the (very long) native build, useful for Java-only checks / lint.
// -PlitegramNativeLibsDir=<dir> packages already built libraries from <dir>/<abi>/libtmessages.49.so
// (build.ps1 builds them with CMake + Ninja) instead of running the native build inside Gradle.
def litegramNativeLibsDir = project.findProperty('litegramNativeLibsDir')
def litegramSkipNative = project.hasProperty('litegramSkipNative') || litegramNativeLibsDir != null

dependencies {
    // Litegram: versions pinned to the newest releases that still support Android 4.4 (API 19).
    implementation 'androidx.core:core:1.13.1'
    // upstream gets collection 1.4.x through androidx.core 1.16 (MutableIntList etc.); pure JVM library
    implementation 'androidx.collection:collection:1.4.5'
    // annotations that upstream gets transitively through androidx.core 1.15+
    implementation 'org.jspecify:jspecify:1.0.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation "androidx.sharetarget:sharetarget:1.2.0"
    implementation 'androidx.interpolator:interpolator:1.0.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation project(':Api19Stubs')
    implementation project(':Api19StubsNoSdk')

    implementation 'com.google.android.gms:play-services-cast-framework:21.4.0'
    implementation "androidx.mediarouter:mediarouter:1.7.0"
    implementation 'com.google.zxing:core:3.5.4'

    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    compileOnly 'org.checkerframework:checker-qual:2.5.2'
    compileOnly 'org.checkerframework:checker-compat-qual:2.5.0'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.android.gms:play-services-auth:20.4.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.android.gms:play-services-wearable:18.0.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.gms:play-services-wallet:19.1.0'
    implementation 'com.googlecode.mp4parser:isoparser:1.0.6'
    implementation 'com.stripe:stripe-android:2.0.2'
    implementation 'com.google.mlkit:language-id:16.1.1'
    // Litegram: Play Billing is never started (sideloaded build uses invoices), kept only for compilation.
    implementation 'com.android.billingclient:billing:8.0.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.google.guava:guava:31.1-android'
    implementation 'com.google.android.play:integrity:1.3.0'
    implementation 'com.google.android.gms:play-services-safetynet:18.0.1'

    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
    implementation 'com.google.android.gms:play-services-mlkit-image-labeling:16.0.8'

    // Litegram: passkeys (androidx.credentials) are not included, see PasskeysController.

    implementation "io.noties.markwon:core:4.6.2"
    implementation "io.noties.markwon:ext-strikethrough:4.6.2"
    implementation "io.noties.markwon:ext-tables:4.6.2"
    implementation "io.noties.markwon:html:4.6.2"
    implementation "io.noties.markwon:inline-parser:4.6.2"
    implementation("io.noties.markwon:ext-latex:4.6.2") {
        exclude group: 'ru.noties', module: 'jlatexmath-android'
    }

    api project(":TMessagesProj_Modules:media3:media-lib-exoplayer")
    api project(":TMessagesProj_Modules:media3:media-lib-exoplayer-dash")
    api project(":TMessagesProj_Modules:media3:media-lib-exoplayer-hls")
    api project(":TMessagesProj_Modules:media3:media-lib-decoder-ffmpeg")
    api project(":TMessagesProj_Modules:media3:media-lib-session")
    api project(':jlatexmath')

    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
    implementation 'com.google.android.recaptcha:recaptcha:18.4.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    // Litegram: NDK r25c is the last NDK that can target Android 4.4 (API 19).
    ndkVersion "25.2.9519653"

    if (!litegramSkipNative) {
        externalNativeBuild {
            cmake {
                path 'jni/CMakeLists.txt'
            }
        }
    }
    if (litegramNativeLibsDir != null) {
        sourceSets.main.jniLibs.srcDirs = [file(litegramNativeLibsDir)]
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }


    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 36

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        multiDexEnabled true

        ndk {
            abiFilters(*litegramAbis)
        }

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-19'
                targets 'tmessages.49'
            }
        }

        buildConfigField "int", "LITEGRAM_API_ID", getProps("litegram.apiId") ?: "4"
        buildConfigField "String", "LITEGRAM_API_HASH", "\"" + (getProps("litegram.apiHash") ?: "014b35b6184100b085b0d0572f9b5103") + "\""
    }

    buildTypes {
        debug {
            jniDebuggable true
            shrinkResources false
            multiDexEnabled true
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "0"
        }

        release {
            jniDebuggable false
            shrinkResources false
            multiDexEnabled true
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"\""
            buildConfigField "boolean", "DEBUG_VERSION", "false"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "7"
        }
    }

    namespace 'org.telegram.messenger'
}


def getProps(String propName) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        def value = props[propName]
        return value != null && !value.toString().trim().isEmpty() ? value.toString().trim() : null
    }
    return null
}
