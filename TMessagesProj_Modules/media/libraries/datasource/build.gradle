apply from: "$gradle.ext.androidxMediaSettingsDir/common_library_config.gradle"

android {
    namespace 'androidx.media3.datasource'

    buildTypes {
        debug {
            testCoverageEnabled = true
        }
    }

    sourceSets {
        androidTest.assets.srcDir '../test_data/src/test/assets'
        test.assets.srcDir '../test_data/src/test/assets'
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    api project(modulePrefix + 'lib-common')
    api project(modulePrefix + 'lib-database')
    implementation 'androidx.annotation:annotation:' + androidxAnnotationVersion
    implementation 'androidx.exifinterface:exifinterface:' + androidxExifInterfaceVersion
    compileOnly 'com.google.code.findbugs:jsr305:' + jsr305Version
    compileOnly 'com.google.errorprone:error_prone_annotations:' + errorProneVersion
    compileOnly 'org.checkerframework:checker-qual:' + checkerframeworkVersion
    compileOnly 'org.jetbrains.kotlin:kotlin-annotations-jvm:' + kotlinAnnotationsVersion
// [litegram]     androidTestImplementation 'androidx.test:runner:' + androidxTestRunnerVersion
// [litegram]     androidTestImplementation 'com.linkedin.dexmaker:dexmaker:' + dexmakerVersion
// [litegram]     androidTestImplementation 'com.linkedin.dexmaker:dexmaker-mockito:' + dexmakerVersion
// [litegram]     androidTestImplementation 'com.squareup.okhttp3:mockwebserver:' + okhttpVersion
// [litegram]     androidTestImplementation(project(modulePrefix + 'test-utils')) {
// [litegram]         exclude module: modulePrefix.substring(1) + 'library-core'
// [litegram]     }
// [litegram]     testImplementation 'org.mockito:mockito-core:' + mockitoVersion
// [litegram]     testImplementation 'androidx.test:core:' + androidxTestCoreVersion
// [litegram]     testImplementation 'androidx.test.ext:junit:' + androidxTestJUnitVersion
// [litegram]     testImplementation 'com.google.truth:truth:' + truthVersion
// [litegram]     testImplementation 'com.squareup.okhttp3:mockwebserver:' + okhttpVersion
// [litegram]     testImplementation 'org.robolectric:robolectric:' + robolectricVersion
// [litegram]     testImplementation project(modulePrefix + 'test-utils')
}

ext {
    releaseArtifactId = 'media3-datasource'
    releaseName = 'Media3 DataSource module'
}
apply from: '../../publish.gradle'
