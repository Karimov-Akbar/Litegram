// Top-level build file where you can add configuration options common to all sub-projects/modules.
// Litegram: Huawei AGConnect, Firebase Crashlytics and google-services plugins are not used
// (no Firebase / HMS in the lightweight Android 4.4 build).
buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
    }
}
repositories {
    google()
}

// Strip JLatexMath fonts we don't ship (transitive AAR assets from
// io.noties.markwon:ext-latex -> ru.noties:jlatexmath-android, ~764 KB total under
// assets/org/scilab/forge/jlatexmath/fonts/). Has to live in the APK modules — a
// library's androidResources.ignoreAssetsPattern doesn't filter packaging in apps
// that consume it. Using subprojects keeps it in one place.
//   keep:  base/, latin/, maths/, euler/  (\mathbb, \mathcal, \mathfrak still work)
//   drop:  latin/optional/, maths/optional/  (~290 KB; \textbf/\textit/\mathds fall back)
//          licences/                          (~20 KB; pure license text files)
subprojects {
    // Litegram: Play Billing 8 pulls play-services-base 18.5 / basement 18.4+ / tasks 18.2+, which
    // require API 21. Billing is never started in this build, so pin the newest Play Services
    // core libraries that still support Android 4.4.
    configurations.configureEach {
        resolutionStrategy {
            force 'com.google.android.gms:play-services-base:18.3.0'
            force 'com.google.android.gms:play-services-basement:18.3.0'
            force 'com.google.android.gms:play-services-tasks:18.1.0'
            // androidx.core 1.15+ requires API 21 (some transitive dependencies ask for 1.15)
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
        }
    }

    plugins.withId('com.android.application') {
        android {
            androidResources {
                ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~:!optional:!licences:!*stmary*:!*eufb*'
            }
        }
    }

    // Litegram: `-PlitegramLint` runs only lint's NewApi check, which lists every call to an
    // Android API newer than minSdk (API 19) that is not guarded by an SDK_INT check.
    if (rootProject.hasProperty('litegramLint')) {
        plugins.withId('com.android.library') {
            android {
                lint {
                    checkOnly 'NewApi'
                    abortOnError false
                    checkDependencies false
                    checkTestSources false
                    ignoreTestSources true
                    xmlReport true
                    htmlReport false
                    textReport true
                }
            }
        }
    }

    if (project.projectDir.absolutePath.replace('\\', '/').contains('/TMessagesProj_Modules/media/')) {
        project.plugins.withId('com.android.library') {
            project.android {
                if (namespace == null) {
                    def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")

                    if (manifestFile.exists()) {
                        def manifest = new XmlSlurper().parse(manifestFile)
                        def manifestPackage = manifest.@package.text()

                        if (manifestPackage) {
                            namespace manifestPackage
                        }
                    }
                }
            }
        }
    }
}
