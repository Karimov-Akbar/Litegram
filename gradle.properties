## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
APP_VERSION_CODE=7112
APP_VERSION_NAME=12.10.6
# Litegram: own package name, so the app can be installed next to the official Telegram.
APP_PACKAGE=org.litegram.messenger
IS_PRIVATE=false
# Fallback signing data (the public upstream dummy keystore). Litegram reads the real
# keystore from local.properties (litegram.storeFile / litegram.storePassword / ...).
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android
# Litegram: tuned for a build machine with 8 GB RAM (upstream uses -Xmx8g).
# Windows: if your temp folder looks like C:\Users\u..., add -Djava.io.tmpdir=C:/some/tmp here
# (the AIDL tool writes the temp path into generated Java comments and "\u" breaks javac);
# scripts/build.ps1 does that automatically.
# disableHorizontalClassMerging: R8 merges unrelated classes (lambdas, anonymous classes) into one;
# if any of them uses Android 5.0+ types in a way the Dalvik verifier of Android 4.4 rejects, the
# merged class - and every original class inside it - fails to load on 4.4.
org.gradle.jvmargs=-Xmx4608m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Dcom.android.tools.r8.disableHorizontalClassMerging=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=3
org.gradle.configureondemand=false
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.enableResourceOptimizations=true
org.gradle.tooling.parallel=true
